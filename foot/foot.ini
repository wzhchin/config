regular7=5b6472
bright0=4b5563
bright1=c83c3c
bright2=248a5b
bright3=b17a17
bright4=3b6ee8
bright5=a657c4
bright6=159ba8
bright7=ffffff

selection-foreground=263238
selection-background=cfe1ff
jump-labels=f7f4ed 2457c5

