[main]
initial-color-theme=light

[colors-light]
background=f7f4ed
foreground=263238
alpha=0.75
blur=true
cursor=f7f4ed 2457c5
regular0=263238
regular1=b42318
regular2=18794e
regular3=9a6700
regular4=2457c5
regular5=8d3ab8
